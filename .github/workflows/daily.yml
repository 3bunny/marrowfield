name: Marrowfield — daily

on:
  schedule:
    # 23:00 UTC = 08:00 the next morning in Seoul.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Advance the world and render, but do not upload (dry run)"
        type: boolean
        default: false

concurrency:
  group: marrowfield-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  chronicle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Advance the world
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '0' }}
        run: python scripts/run_day.py || (echo "retry in 60s" && sleep 60 && python scripts/run_day.py) || (echo "retry in 240s" && sleep 240 && python scripts/run_day.py)

      - name: Commit the day
        run: |
          git config user.name  "marrowfield-bot"
          git config user.email "marrowfield-bot@users.noreply.github.com"
          git add -A world.json archive chronicle log.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "day $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Keep the render for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render
          path: build/
          retention-days: 14
          if-no-files-found: ignore
